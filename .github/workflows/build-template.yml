name: Build and Test Template

on:
  workflow_call:
    inputs:
      configuration:
        required: false
        type: string
        default: Release

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.100-rc.1.26425.128

      - name: Restore dependencies
        run: dotnet restore NTComponents.Charts.slnx -p:UseLocalNTComponentsProject=false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Install TypeScript build dependencies
        run: npm ci

      - name: Compile and test chart TypeScript
        run: npm test

      - name: Build all target frameworks
        run: dotnet build NTComponents.Charts.slnx --no-restore --configuration ${{ inputs.configuration }} -m:1 -p:UseLocalNTComponentsProject=false

      - name: Pack CI package
        run: dotnet pack NTComponents.Charts/NTComponents.Charts.csproj --no-build --configuration ${{ inputs.configuration }} --output artifacts/nuget -p:PackageVersion=0.0.0-ci.${{ github.run_id }} -p:UseLocalNTComponentsProject=false

      - name: Upload CI package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg

  package-consumer:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0, net11.0]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.100-rc.1.26425.128

      - name: Download CI package
        uses: actions/download-artifact@v8
        with:
          name: nuget-package
          path: artifacts/nuget

      - name: Validate package consumer
        shell: pwsh
        run: ./test-package.ps1 -PackagePath (Get-ChildItem artifacts/nuget/*.nupkg).FullName -Frameworks ${{ matrix.framework }}

  dotnet-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net9.0, net10.0, net11.0]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
            11.0.100-rc.1.26425.128

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Compile chart TypeScript
        run: |
          npm ci
          npm run build:ts

      - name: Restore test dependencies
        run: dotnet restore Tests/NTComponents.Charts.Tests/NTComponents.Charts.Tests.csproj -p:UseLocalNTComponentsProject=false

      - name: Test ${{ matrix.framework }}
        run: dotnet test --project Tests/NTComponents.Charts.Tests/NTComponents.Charts.Tests.csproj --configuration ${{ inputs.configuration }} --framework ${{ matrix.framework }} --no-restore -p:UseLocalNTComponentsProject=false

  build-test-pack:
    needs: [build, dotnet-test, package-consumer]
    runs-on: ubuntu-latest
    steps:
      - name: Build and package validation succeeded
        run: echo "Build, test, and package-consumer validation completed successfully."
